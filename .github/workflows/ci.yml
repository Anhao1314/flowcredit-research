name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    env:
      NODE_ENV: test
      DSH_TELEMETRY_MODE: DISABLED
      FC_RETRIEVAL_PYTHON: python
      FC_GROUNDING_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research PDF parser
        run: python -m pip install -r ../research/retrieval/requirements.txt
      - name: Install locked dependencies
        run: npm ci
      - name: JavaScript syntax
        run: npm run check:syntax
      - name: Rule registry type check
        run: npm run typecheck
      - name: Frontend discipline
        run: npm run check:frontend
      - name: Development isolation
        run: npm run check:isolation
      - name: Unit and regression tests
        run: npm test
      - name: Research Evidence Bridge tests
        run: node --test ../research/test/*.test.js
      - name: Research Memory Core tests
        run: node --test ../research/memory-test/*.test.js
      - name: Research Retrieval Layer tests
        run: node --test ../research/retrieval-test/*.test.js
      - name: Evidence Admission Layer tests
        run: node --test ../research/admission-test/*.test.js
      - name: Research Evidence Analyst tests
        run: node --test ../research/analyst-test/*.test.js
      - name: Research Evidence Analyst Real Validation offline tests
        run: node --test ../research/analyst-real-test/*.test.js
      - name: Evidence Analyst Contract Stabilization offline tests
        run: node --test ../research/analyst-staged-test/*.test.js
      - name: Source Grounding Layer offline tests
        run: node --test ../research/grounding-test/*.test.js
      - name: Evidence Support Contract offline tests
        run: node --test ../research/evidence-support-test/*.test.js
      - name: Local LLM Validation offline tests
        run: node --test ../research/local-model-test/*.test.js
      - name: Local Hybrid Retrieval offline tests
        run: node --test ../research/local-retrieval-test/*.test.js
      - name: Public API contract
        run: npm run validate:public-api
      - name: Finch contract
        run: npm run validate:finch-contract
      - name: Release verification
        run: npm run verify:release
